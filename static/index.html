<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgroVessel</title>
<style>
  :root {
    --green: #2e7d32;
    --green-dark: #1b5e20;
    --bg: #f6f8f4;
    --card: #ffffff;
    --border: #dbe3d6;
    --text: #1f2a1f;
    --muted: #5c6b5c;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--green-dark);
    color: white;
    padding: 1.25rem 1.5rem;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  header p { margin: 0.25rem 0 0; opacity: 0.85; font-size: 0.9rem; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 1.5rem;
    display: grid;
    grid-template-columns: minmax(280px, 380px) 1fr;
    gap: 1.5rem;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
  }
  fieldset { border: none; padding: 0; margin: 0 0 1rem; }
  legend { font-weight: 600; margin-bottom: 0.5rem; padding: 0; }
  label {
    display: block;
    font-size: 0.82rem;
    color: var(--muted);
    margin: 0.6rem 0 0.2rem;
  }
  input, select {
    width: 100%;
    padding: 0.45rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.92rem;
    background: white;
    color: var(--text);
  }
  .row { display: flex; gap: 0.6rem; }
  .row > div { flex: 1; }
  .checks { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.3rem; }
  .checks label {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.55rem;
    font-size: 0.85rem;
    color: var(--text);
    cursor: pointer;
  }
  .checks input { width: auto; }
  button {
    width: 100%;
    margin-top: 1.1rem;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.7rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--green-dark); }
  button:disabled { background: #9db99a; cursor: wait; }
  .locate {
    width: auto;
    margin: 0;
    background: white;
    color: var(--green-dark);
    border: 1px solid var(--green);
    padding: 0.35rem 0.6rem;
    font-size: 0.78rem;
    font-weight: 500;
  }
  .locate:hover { background: #eaf4e8; }
  #results { display: flex; flex-direction: column; gap: 0.9rem; }
  .placeholder { color: var(--muted); font-size: 0.92rem; }
  .rec {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
    background: var(--card);
    position: relative;
  }
  .rec.best { border-color: var(--green); box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.15); }
  .rec .badge {
    position: absolute;
    top: -0.6rem;
    right: 0.8rem;
    background: var(--green);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.15rem 0.55rem;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .rec h3 { margin: 0 0 0.2rem; font-size: 1.05rem; }
  .rec .sub { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.6rem; }
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 0.5rem 1rem;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
  }
  .stats .k { color: var(--muted); display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.02em; }
  .stats .v { font-weight: 600; }
  .profit-pos { color: var(--green-dark); }
  .profit-neg { color: var(--danger); }
  .departure { font-size: 0.82rem; color: var(--text); background: #f1f5ef; border-radius: 6px; padding: 0.5rem 0.6rem; margin-top: 0.3rem; }
  .departure.infeasible { background: #fbeceb; }
  .notes { font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; }
  .disclaimers {
    margin-top: 1.25rem;
    font-size: 0.76rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 0.75rem;
  }
  .disclaimers li { margin-bottom: 0.25rem; }
  .error { color: var(--danger); font-size: 0.88rem; }
</style>
</head>
<body>
<header style="display: flex; justify-content: space-between; align-items: center;">
  <div>
    <h1 id="i18n-title">AgroVessel</h1>
    <p id="i18n-subtitle">Which mandi should you truck this harvest to today?</p>
  </div>
  <div>
    <select id="lang-toggle" onchange="switchLang(this.value)" style="padding: 0.25rem; border-radius: 4px; border: none; background: white; color: var(--green-dark); font-weight: bold; width: auto; font-size: 0.9rem;">
      <option value="en">English</option>
      <option value="hi">हिंदी</option>
    </select>
  </div>
</header>
<main>
  <form class="card" id="form">
    <fieldset>
      <legend id="i18n-leg-crop">Crop &amp; quantity</legend>
      <label for="crop" id="i18n-lbl-crop">Crop</label>
      <input list="crop-list" id="crop" name="crop" placeholder="e.g. Tomato" required />
      <datalist id="crop-list"></datalist>

      <label for="quantity_kg" id="i18n-lbl-qty">Quantity (kg)</label>
      <input type="number" id="quantity_kg" min="1" step="1" value="1000" required />
    </fieldset>

    <fieldset>
      <legend id="i18n-leg-orig">Origin</legend>
      <div class="row">
        <div>
          <label for="origin_lat" id="i18n-lbl-lat">Latitude</label>
          <input type="number" id="origin_lat" step="0.0001" value="13.1367" required />
        </div>
        <div>
          <label for="origin_lon" id="i18n-lbl-lon">Longitude</label>
          <input type="number" id="origin_lon" step="0.0001" value="78.1298" required />
        </div>
      </div>
      <button type="button" class="locate" id="locate"><span id="i18n-btn-loc">Use my location</span></button>

      <label for="origin_state" id="i18n-lbl-state">State</label>
      <select id="origin_state" required></select>

      <label for="local_price_per_kg" id="i18n-lbl-local">Local/village price (Rs/kg, optional)</label>
      <input type="number" id="local_price_per_kg" step="0.1" placeholder="leave blank to skip" />
    </fieldset>

    <fieldset>
      <legend id="i18n-leg-trip">Trip &amp; costs</legend>
      <div class="row">
        <div>
          <label for="truck_mileage_kmpl" id="i18n-lbl-mil">Mileage (km/l)</label>
          <input type="number" id="truck_mileage_kmpl" step="0.1" value="12" required />
        </div>
        <div>
          <label for="diesel_price_per_litre" id="i18n-lbl-dsl">Diesel (Rs/l, optional)</label>
          <input type="number" id="diesel_price_per_litre" step="0.1" placeholder="use state default" />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="toll_per_km" id="i18n-lbl-toll">Toll (Rs/km, one-way)</label>
          <input type="number" id="toll_per_km" step="0.1" value="2" required />
        </div>
        <div>
          <label for="driver_fee" id="i18n-lbl-drv">Driver fee (Rs, flat)</label>
          <input type="number" id="driver_fee" step="10" value="1500" required />
        </div>
      </div>
      <div class="row">
        <div>
          <label for="max_distance_km" id="i18n-lbl-dist">Max distance (km)</label>
          <input type="number" id="max_distance_km" step="10" value="300" max="600" required />
        </div>
        <div>
          <label for="market_closes_hour" id="i18n-lbl-close">Market closes (24h)</label>
          <input type="number" id="market_closes_hour" min="0" max="23" value="18" required />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend id="i18n-leg-dep">Candidate departure times</legend>
      <div class="checks" id="departures"></div>
    </fieldset>

    <button type="submit" id="submit"><span id="i18n-btn-find">Find best market</span></button>
  </form>

  <section class="card">
    <div id="status" class="placeholder"><span id="i18n-status-init">Fill in the form and submit to see ranked mandi recommendations.</span></div>
    <div id="results"></div>
  </section>
</main>

<script>
const API = "";
const STATES = [
  "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh",
  "Goa", "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka",
  "Kerala", "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya",
  "Mizoram", "Nagaland", "Odisha", "Punjab", "Rajasthan", "Sikkim",
  "Tamil Nadu", "Telangana", "Tripura", "Uttar Pradesh", "Uttarakhand",
  "West Bengal", "Andaman and Nicobar", "Chandigarh",
  "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Jammu and Kashmir",
  "Ladakh", "Lakshadweep", "Puducherry",
];
const DEPARTURES = ["04:00", "07:00", "10:00", "13:00", "16:00"];

const stateSelect = document.getElementById("origin_state");
STATES.forEach((s) => {
  const opt = document.createElement("option");
  opt.value = s;
  opt.textContent = s;
  stateSelect.appendChild(opt);
});
stateSelect.value = "Karnataka";

const departuresDiv = document.getElementById("departures");
DEPARTURES.forEach((t, i) => {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "checkbox";
  input.value = t;
  input.checked = i < 4;
  label.appendChild(input);
  label.appendChild(document.createTextNode(t));
  departuresDiv.appendChild(label);
});

fetch(`${API}/api/crops`)
  .then((r) => r.json())
  .then((crops) => {
    const list = document.getElementById("crop-list");
    crops.forEach((c) => {
      const opt = document.createElement("option");
      opt.value = c.replace(/\b\w/g, (ch) => ch.toUpperCase());
      list.appendChild(opt);
    });
  })
  .catch(() => {});

document.getElementById("locate").addEventListener("click", () => {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition((pos) => {
    document.getElementById("origin_lat").value = pos.coords.latitude.toFixed(4);
    document.getElementById("origin_lon").value = pos.coords.longitude.toFixed(4);
    fetch(`${API}/api/locate?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`)
      .then((r) => r.json())
      .then((d) => { if (d.state) stateSelect.value = d.state; })
      .catch(() => {});
  });
});

function money(n) {
  return "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
}

function renderRecommendation(rec, isBest) {
  const div = document.createElement("div");
  div.className = "rec" + (isBest ? " best" : "");
  if (isBest) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "BEST";
    div.appendChild(badge);
  }

  const h3 = document.createElement("h3");
  h3.textContent = rec.market_name;
  div.appendChild(h3);

  const sub = document.createElement("div");
  sub.className = "sub";
  sub.textContent = rec.is_local
    ? "Local sale"
    : `${rec.state} · ${rec.distance_km} km · ${rec.duration_hr} hr drive`;
  div.appendChild(sub);

  const stats = document.createElement("div");
  stats.className = "stats";
  const profitClass = rec.net_profit >= 0 ? "profit-pos" : "profit-neg";
  const entries = [
    ["Mandi price", `${money(rec.mandi_price_per_kg)}/kg`],
    ["Gross revenue", money(rec.gross_revenue)],
    ["Transport cost", money(rec.transport_cost)],
    ["Net profit", money(rec.net_profit), profitClass],
    ["Usable / lost", `${rec.usable_kg} kg / ${rec.lost_kg} kg`],
  ];
  entries.forEach(([k, v, cls]) => {
    const wrap = document.createElement("div");
    const kEl = document.createElement("span");
    kEl.className = "k";
    kEl.textContent = k;
    const vEl = document.createElement("span");
    vEl.className = "v" + (cls ? " " + cls : "");
    vEl.textContent = v;
    wrap.appendChild(kEl);
    wrap.appendChild(vEl);
    stats.appendChild(wrap);
  });
  div.appendChild(stats);

  if (rec.best_departure) {
    const bd = rec.best_departure;
    const dep = document.createElement("div");
    dep.className = "departure" + (bd.feasible ? "" : " infeasible");
    dep.textContent = `Depart ${bd.departure_time} → arrive ${bd.arrival_time}` +
      (bd.avg_transit_temp_c != null ? ` (~${bd.avg_transit_temp_c}°C in transit)` : "") +
      ` — est. ${bd.predicted_loss_pct}% spoilage. ${bd.reason}.`;
    div.appendChild(dep);
  }

  if (rec.price_source_date) {
    const p = document.createElement("div");
    p.className = "notes";
    p.textContent = `Price as of ${rec.price_source_date}`;
    div.appendChild(p);
  }

  if (rec.notes && rec.notes.length) {
    const n = document.createElement("div");
    n.className = "notes";
    n.textContent = rec.notes.join(" ");
    div.appendChild(n);
  }

  return div;
}

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const submitBtn = document.getElementById("submit");
  resultsEl.innerHTML = "";
  statusEl.textContent = i18n[currentLang].status_loading;
  statusEl.className = "placeholder";
  submitBtn.disabled = true;

  const departureOptions = Array.from(
    departuresDiv.querySelectorAll("input:checked")
  ).map((el) => el.value);

  const localPrice = document.getElementById("local_price_per_kg").value;
  const dieselPrice = document.getElementById("diesel_price_per_litre").value;

  const payload = {
    crop: document.getElementById("crop").value,
    quantity_kg: Number(document.getElementById("quantity_kg").value),
    origin_lat: Number(document.getElementById("origin_lat").value),
    origin_lon: Number(document.getElementById("origin_lon").value),
    origin_state: document.getElementById("origin_state").value,
    local_price_per_kg: localPrice ? Number(localPrice) : null,
    truck_mileage_kmpl: Number(document.getElementById("truck_mileage_kmpl").value),
    diesel_price_per_litre: dieselPrice ? Number(dieselPrice) : null,
    toll_per_km: Number(document.getElementById("toll_per_km").value),
    driver_fee: Number(document.getElementById("driver_fee").value),
    max_distance_km: Number(document.getElementById("max_distance_km").value),
    market_closes_hour: Number(document.getElementById("market_closes_hour").value),
    departure_options: departureOptions.length ? departureOptions : DEPARTURES,
  };

  try {
    const resp = await fetch(`${API}/api/recommend`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) {
      const detail = await resp.text();
      throw new Error(detail || `Request failed (${resp.status})`);
    }
    const data = await resp.json();

    if (!data.recommendations.length) {
      statusEl.textContent = `No mandi within your distance limit has a price for this crop today. Try a larger max distance or another departure time. ${(data.disclaimers || []).join(" ")}`;
      statusEl.className = "error";
      return;
    }

    statusEl.textContent = `Diesel used: ${money(data.diesel_price_per_litre)}/l (${data.diesel_price_source})`;
    statusEl.className = "placeholder";

    data.recommendations.forEach((rec) => {
      resultsEl.appendChild(renderRecommendation(rec, rec.market_id === data.best_market_id));
    });

    if (data.disclaimers && data.disclaimers.length) {
      const ul = document.createElement("ul");
      ul.className = "disclaimers";
      data.disclaimers.forEach((d) => {
        const li = document.createElement("li");
        li.textContent = d;
        ul.appendChild(li);
      });
      resultsEl.appendChild(ul);
    }
  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    statusEl.className = "error";
  } finally {
    submitBtn.disabled = false;
  }
});

const i18n = {
  en: {
    title: "AgroVessel",
    subtitle: "Which mandi should you truck this harvest to today?",
    leg_crop: "Crop & quantity",
    lbl_crop: "Crop",
    lbl_qty: "Quantity (kg)",
    leg_orig: "Origin",
    lbl_lat: "Latitude",
    lbl_lon: "Longitude",
    btn_loc: "Use my location",
    lbl_state: "State",
    lbl_local: "Local/village price (Rs/kg, optional)",
    leg_trip: "Trip & costs",
    lbl_mil: "Mileage (km/l)",
    lbl_dsl: "Diesel (Rs/l, optional)",
    lbl_toll: "Toll (Rs/km, one-way)",
    lbl_drv: "Driver fee (Rs, flat)",
    lbl_dist: "Max distance (km)",
    lbl_close: "Market closes (24h)",
    leg_dep: "Candidate departure times",
    btn_find: "Find best market",
    status_init: "Fill in the form and submit to see ranked mandi recommendations.",
    status_loading: "Checking mandi prices, routes, and weather..."
  },
  hi: {
    title: "एग्रोवेसल",
    subtitle: "आज आपको अपनी फसल किस मंडी में भेजनी चाहिए?",
    leg_crop: "फसल और मात्रा",
    lbl_crop: "फसल",
    lbl_qty: "मात्रा (किलो)",
    leg_orig: "मूल स्थान",
    lbl_lat: "अक्षांश",
    lbl_lon: "देशांतर",
    btn_loc: "मेरे स्थान का उपयोग करें",
    lbl_state: "राज्य",
    lbl_local: "स्थानीय कीमत (रु/किलो)",
    leg_trip: "यात्रा और लागत",
    lbl_mil: "माइलेज (किमी/लीटर)",
    lbl_dsl: "डीजल (रु/लीटर)",
    lbl_toll: "टोल (रु/किमी, एकतरफा)",
    lbl_drv: "ड्राइवर शुल्क (रु, निश्चित)",
    lbl_dist: "अधिकतम दूरी (किमी)",
    lbl_close: "बाजार बंद (24h)",
    leg_dep: "संभावित प्रस्थान",
    btn_find: "सर्वश्रेष्ठ बाजार खोजें",
    status_init: "मंडी की सिफारिशें देखने के लिए फॉर्म भरें और सबमिट करें।",
    status_loading: "मंडी की कीमतों, मार्गों और मौसम की जांच हो रही है..."
  }
};

let currentLang = "en";

function switchLang(lang) {
  currentLang = lang;
  const dict = i18n[lang];
  
  document.getElementById("i18n-title").innerText = dict.title;
  document.getElementById("i18n-subtitle").innerText = dict.subtitle;
  document.getElementById("i18n-leg-crop").innerHTML = dict.leg_crop;
  document.getElementById("i18n-lbl-crop").innerText = dict.lbl_crop;
  document.getElementById("i18n-lbl-qty").innerText = dict.lbl_qty;
  document.getElementById("i18n-leg-orig").innerText = dict.leg_orig;
  document.getElementById("i18n-lbl-lat").innerText = dict.lbl_lat;
  document.getElementById("i18n-lbl-lon").innerText = dict.lbl_lon;
  document.getElementById("i18n-btn-loc").innerText = dict.btn_loc;
  document.getElementById("i18n-lbl-state").innerText = dict.lbl_state;
  document.getElementById("i18n-lbl-local").innerText = dict.lbl_local;
  document.getElementById("i18n-leg-trip").innerText = dict.leg_trip;
  document.getElementById("i18n-lbl-mil").innerText = dict.lbl_mil;
  document.getElementById("i18n-lbl-dsl").innerText = dict.lbl_dsl;
  document.getElementById("i18n-lbl-toll").innerText = dict.lbl_toll;
  document.getElementById("i18n-lbl-drv").innerText = dict.lbl_drv;
  document.getElementById("i18n-lbl-dist").innerText = dict.lbl_dist;
  document.getElementById("i18n-lbl-close").innerText = dict.lbl_close;
  document.getElementById("i18n-leg-dep").innerText = dict.leg_dep;
  document.getElementById("i18n-btn-find").innerText = dict.btn_find;
  
  const statusEl = document.getElementById("status");
  if (statusEl && statusEl.classList.contains("placeholder")) {
     const statusSpan = document.getElementById("i18n-status-init");
     if(statusSpan) {
       statusSpan.innerText = dict.status_init;
     } else if(statusEl.innerText.includes("Checking") || statusEl.innerText.includes("जांच")) {
        statusEl.innerText = dict.status_loading;
     } else {
        statusEl.innerHTML = `<span id="i18n-status-init">${dict.status_init}</span>`;
     }
  }
}
</script>
</body>
</html>
